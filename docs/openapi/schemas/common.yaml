# Схемы: статистика (TypeStat, LanguageStat, DashboardStats), KB-конфиг, чат/ask, ошибки/успех, колонки, комментарии, pipeline.
---
TypeStat:
  type: object
  required:
    - name
    - count
  properties:
    name:
      type: string
    count:
      type: integer
LanguageStat:
  type: object
  required:
    - name
    - value
  properties:
    name:
      type: string
    value:
      type: integer
DashboardStats:
  type: object
  required:
    - totalItems
    - totalDeps
    - averageDependencyDensity
    - typeStats
    - languageStats
    - vectorIndexSize
    - lastScan
  properties:
    totalItems:
      type: integer
    totalDeps:
      type: integer
    averageDependencyDensity:
      type: string
    typeStats:
      type: array
      items:
        $ref: '#/components/schemas/TypeStat'
    languageStats:
      type: array
      items:
        $ref: '#/components/schemas/LanguageStat'
    vectorIndexSize:
      type: string
    lastScan:
      type: string
      format: date-time
KnowledgeBaseConfig:
  type: object
  required:
    - rootPath
    - includeMask
    - ignorePatterns
    - lastUpdated
  properties:
    rootPath:
      type: string
      description: Абсолютный путь к проекту на стороне бэкенда
      example: /app/projects/my-awesome-app
    includeMask:
      type: string
      description: Glob-паттерн включаемых файлов (для обратной совместимости)
      example: '**/*.{py,js,ts,tsx,go,java}'
    ignorePatterns:
      type: string
      description: Паттерны игнорирования (через запятую)
      example: '**/node_modules/**,**/venv/**,**/__pycache__/**,**/dist/**'
    fileSelection:
      type: array
      items:
        type: string
      description: |
        Точный список выбранных относительных путей.
        Если массив не пустой — имеет приоритет над includeMask/ignorePatterns.
      example:
        - ./src/utils/api.ts
        - ./src/components/Button.tsx
        - ./backend/main.py
    lastUpdated:
      type: string
      format: date-time
    metadata:
      type: object
      description: Произвольные метаданные проекта
      example:
        projectName: My Awesome App
        description: Full-stack монолит
        tags:
          - react
          - fastapi
          - docker
FileSelectionRequest:
  type: object
  required:
    - rootPath
    - files
  properties:
    rootPath:
      type: string
      example: /app/projects/my-app
    files:
      type: array
      items:
        type: string
      example:
        - ./src/utils/api.ts
        - ./src/components/Button.tsx
ChatRequest:
  type: object
  required:
    - message
  properties:
    message:
      type: string
      description: Сообщение пользователя (вопрос или готовое сообщение с контекстом)
    useRAG:
      type: boolean
      default: false
      description: |
        Если true - выполнить RAG-поиск контекста перед отправкой в LLM.
        Если false (по умолчанию) - отправить message напрямую в LLM без векторизации.
        Используйте false, когда клиент уже сформировал готовое сообщение с контекстом.
ChatResponse:
  type: object
  required:
    - response
    - timestamp
  properties:
    response:
      type: string
    usedContextIds:
      type: array
      items:
        type: string
    timestamp:
      type: string
      format: date-time
AskRequest:
  type: object
  required:
    - message
  properties:
    message:
      type: string
      description: Сообщение пользователя
      example: Что такое JavaScript?
    systemPrompt:
      type: string
      nullable: true
      description: Системный промпт (опционально)
      example: Отвечай кратко и по делу
    model:
      type: string
      nullable: true
      description: Имя модели (опционально, по умолчанию из конфига)
      example: FAST
AskResponse:
  type: object
  required:
    - response
    - timestamp
  properties:
    response:
      type: string
      description: Ответ от LLM
    timestamp:
      type: string
      format: date-time
      description: Время ответа
SuccessResponse:
  type: object
  required:
    - success
  properties:
    success:
      type: boolean
      enum:
        - true
    message:
      type: string
ErrorResponse:
  type: object
  required:
    - success
    - error
  properties:
    success:
      type: boolean
      enum:
        - false
    error:
      type: string
HealthResponse:
  type: object
  required:
    - status
    - timestamp
    - version
  properties:
    status:
      type: string
      enum:
        - ok
    timestamp:
      type: string
      format: date-time
    version:
      type: string
      example: 2.3.1
ColumnInfo:
  type: object
  required:
    - fullName
    - operation
    - resolved
  properties:
    fullName:
      type: string
      description: Полное имя колонки (schema.table.column или unknown.column)
      example: hr.employees.first_name
    operation:
      type: string
      enum:
        - select
        - update
        - insert
      description: Тип операции над колонкой
    resolved:
      type: boolean
      description: Удалось ли резолвить полное имя таблицы
    ambiguous:
      type: boolean
      description: Колонка найдена в нескольких таблицах (не удалось однозначно резолвить)
    tableFullName:
      type: string
      nullable: true
      description: Полное имя таблицы (если resolved=true)
      example: hr.employees
ColumnExtractionReport:
  type: object
  required:
    - functionFullName
    - functionAiItemId
    - columnsFound
    - columnsResolved
    - columnsUnresolved
    - linksCreated
    - columns
  properties:
    functionFullName:
      type: string
      description: Полное имя функции
      example: hr.get_employee_skills
    functionAiItemId:
      type: integer
      description: ID ai_item функции
    columnsFound:
      type: integer
      description: Всего найдено колонок в SQL
      example: 5
    columnsResolved:
      type: integer
      description: Колонок с резолвленным полным именем
      example: 4
    columnsUnresolved:
      type: integer
      description: Колонок без резолвленного имени (unknown.column)
      example: 1
    columnsAmbiguous:
      type: integer
      description: Колонок с неоднозначным резолвингом
      example: 0
    linksCreated:
      type: integer
      description: Создано связей function→column
      example: 5
    columns:
      type: array
      items:
        $ref: '#/components/schemas/ColumnInfo'
      description: Список извлечённых колонок
    errors:
      type: array
      items:
        type: string
      description: Список ошибок при обработке
ColumnExtractionResponse:
  type: object
  required:
    - success
    - report
  properties:
    success:
      type: boolean
      enum:
        - true
    report:
      $ref: '#/components/schemas/ColumnExtractionReport'
BatchColumnExtractionReport:
  type: object
  required:
    - totalFunctions
    - functionsProcessed
    - functionsSkipped
    - totalColumnsFound
    - totalColumnsResolved
    - totalColumnsUnresolved
    - totalLinksCreated
  properties:
    totalFunctions:
      type: integer
      description: Всего SQL-функций в контексте
      example: 50
    functionsProcessed:
      type: integer
      description: Успешно обработано функций
      example: 48
    functionsSkipped:
      type: integer
      description: Пропущено функций (ошибки)
      example: 2
    totalColumnsFound:
      type: integer
      description: Всего найдено колонок
      example: 320
    totalColumnsResolved:
      type: integer
      description: Колонок с резолвленным полным именем
      example: 280
    totalColumnsUnresolved:
      type: integer
      description: Колонок без резолвленного имени
      example: 40
    totalLinksCreated:
      type: integer
      description: Всего создано связей function→column
      example: 320
    reports:
      type: array
      description: Краткий отчёт по каждой функции
      items:
        type: object
        properties:
          functionFullName:
            type: string
            example: hr.get_employee_skills
          columnsFound:
            type: integer
          columnsResolved:
            type: integer
          linksCreated:
            type: integer
          hasErrors:
            type: boolean
    errors:
      type: array
      items:
        type: string
      description: Список ошибок при обработке
BatchColumnExtractionResponse:
  type: object
  required:
    - success
    - report
  properties:
    success:
      type: boolean
      enum:
        - true
    report:
      $ref: '#/components/schemas/BatchColumnExtractionReport'
RebuildSqlLinksReport:
  type: object
  description: Отчёт о пересборке L1-связей из клиентской БД
  properties:
    fullName:
      type: string
      description: full_name обработанного AiItem
      example: carl_inspect._getCityFromReport
    type:
      type: string
      description: Тип AiItem (function или table)
      example: function
    linksDeleted:
      type: integer
      description: Количество удалённых старых связей в link
    linksCreated:
      type: integer
      description: Количество созданных связей в link
    l1Result:
      type: object
      description: |
        Распарсенные L1-зависимости. Для функции: called_functions, select_from, update_tables, insert_tables.
        Для таблицы: foreign_keys, referenced_tables.
    chunkUpdated:
      type: boolean
      description: Был ли обновлён или создан L1-чанк в chunk_vector
    errors:
      type: array
      items:
        type: string
      description: Список ошибок при вставке отдельных связей (если были)
RebuildSqlLinksResponse:
  type: object
  required:
    - success
    - report
  properties:
    success:
      type: boolean
      enum:
        - true
    report:
      $ref: '#/components/schemas/RebuildSqlLinksReport'
AiComment:
  type: object
  required:
    - comment
    - createdAt
  properties:
    comment:
      type: string
      description: Текст комментария для ai_item
      nullable: true
    createdAt:
      type: string
      format: date-time
      description: Время создания комментария
    updatedAt:
      type: string
      format: date-time
      nullable: true
      description: Время последнего обновления комментария
AiCommentResponse:
  type: object
  required:
    - success
    - itemId
    - comment
    - createdAt
  properties:
    success:
      type: boolean
      enum:
        - true
    itemId:
      type: string
      description: ID AiItem (full_name)
      example: utils.fetchData
    comment:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
      nullable: true
AiCommentRequest:
  type: object
  required:
    - comment
  properties:
    comment:
      type: string
      description: Текст комментария
      example: Этот метод обрабатывает HTTP запросы
PipelineStepStatus:
  type: object
  required:
    - id
    - name
    - label
    - status
    - progress
    - itemsProcessed
    - totalItems
  properties:
    id:
      type: integer
      description: ID шага (1-7)
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    name:
      type: string
      description: Имя шага
      enum:
        - parsing
        - dependencies
        - enrichment
        - vectorization
        - indexing
    label:
      type: string
      description: Человекочитаемое название шага (с префиксом + для активных шагов)
      example: +Polyglot Parsing (L0)
    status:
      type: string
      description: Статус шага
      enum:
        - pending
        - running
        - completed
        - failed
    progress:
      type: integer
      description: Прогресс выполнения (0-100)
      minimum: 0
      maximum: 100
    itemsProcessed:
      type: integer
      description: Количество обработанных элементов
      minimum: 0
    totalItems:
      type: integer
      description: Общее количество элементов
      minimum: 0
    startedAt:
      type: string
      format: date-time
      nullable: true
      description: Время начала выполнения
    completedAt:
      type: string
      format: date-time
      nullable: true
      description: Время завершения выполнения
    error:
      type: string
      nullable: true
      description: Сообщение об ошибке (если статус failed)
    report:
      type: object
      nullable: true
      description: Детальный отчет о выполнении шага в произвольном формате JSON (структура зависит от конкретного шага, доступен после завершения)
PipelineStepDefinition:
  type: object
  required:
    - id
    - name
    - label
    - description
  properties:
    id:
      type: integer
      description: ID шага (1-5)
    name:
      type: string
      description: Системное имя шага
      enum:
        - parsing
        - dependencies
        - enrichment
        - vectorization
        - indexing
    label:
      type: string
      description: Человекочитаемое название
    description:
      type: string
      description: Подробное описание того, что делает этот шаг
    configurationSchema:
      type: object
      description: Спецификация доступных настроек для этого шага (для динамического построения UI)
PipelineContextDefinition:
  type: object
  required:
    - steps
  properties:
    steps:
      type: array
      items:
        $ref: '#/components/schemas/PipelineStepDefinition'
PipelineContextConfig:
  type: object
  description: Конфигурация шагов pipeline для конкретного контекста
  additionalProperties:
    type: object
    description: 'Объект настроек для конкретного шага (например, { "embeddingModel": "..." })'
PipelineStepsStatusResponse:
  type: object
  required:
    - success
    - steps
  properties:
    success:
      type: boolean
      enum:
        - true
    steps:
      type: array
      items:
        $ref: '#/components/schemas/PipelineStepStatus'
PipelineStepHistoryEntry:
  type: object
  required:
    - timestamp
    - status
  properties:
    timestamp:
      type: string
      format: date-time
      description: Время изменения состояния
    status:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
      description: Статус шага в момент записи
    progress:
      type: integer
      minimum: 0
      maximum: 100
      nullable: true
      description: Прогресс выполнения (0-100)
    itemsProcessed:
      type: integer
      minimum: 0
      nullable: true
      description: Количество обработанных элементов
    totalItems:
      type: integer
      minimum: 0
      nullable: true
      description: Общее количество элементов
    error:
      type: string
      nullable: true
      description: Сообщение об ошибке (если есть)
    report:
      type: object
      nullable: true
      description: Отчет о выполнении (если доступен)
PipelineStepHistoryResponse:
  type: object
  required:
    - success
    - stepId
    - history
  properties:
    success:
      type: boolean
      enum:
        - true
    stepId:
      type: integer
      description: ID шага
    stepName:
      type: string
      description: Имя шага
    history:
      type: array
      items:
        $ref: '#/components/schemas/PipelineStepHistoryEntry'
      description: История выполнения шага (от старых к новым)
PipelineStepsHistoryResponse:
  type: object
  required:
    - success
    - steps
  properties:
    success:
      type: boolean
      enum:
        - true
    steps:
      type: array
      items:
        type: object
        required:
          - stepId
          - stepName
          - history
        properties:
          stepId:
            type: integer
            description: ID шага
          stepName:
            type: string
            description: Имя шага
          history:
            type: array
            items:
              $ref: '#/components/schemas/PipelineStepHistoryEntry'
            description: История выполнения шага (от старых к новым)
AppConfig:
  type: object
  required:
    - KOSMOS_BASE_URL
    - KOSMOS_MODEL
    - LOG_LEVEL
  properties:
    KOSMOS_BASE_URL:
      type: string
      format: uri
      description: Базовый URL для API kosmos-model
      example: http://localhost:3002/v1
    KOSMOS_MODEL:
      type: string
      description: |
        Модель по умолчанию для LLM запросов.
        TODO: Согласовать список допустимых моделей с проектом kosmos-model
      example: FAST
    KOSMOS_LOGIC_ARHITECT_MODEL:
      type: string
      nullable: true
      description: |
        Модель для Logic Architect (анализ логики функций).
        TODO: Согласовать список допустимых моделей с проектом kosmos-model
      example: INSTRUCT
    LOG_LEVEL:
      type: string
      enum:
        - debug
        - info
        - warn
        - error
      description: Уровень логирования
      default: info
    NATURAL_QUERY_SUGGEST_LIMIT:
      type: integer
      minimum: 1
      maximum: 100
      description: Количество подсказок для natural query
      default: 5
    NATURAL_QUERY_SIMILARITY_THRESHOLD:
      type: number
      minimum: 0
      maximum: 1
      description: Порог схожести для поиска похожих вопросов
      default: 0.8
    NATURAL_QUERY_AUTO_USE_THRESHOLD:
      type: number
      minimum: 0
      maximum: 1
      description: Порог для автоматического использования cached скриптов
      default: 0.95
AppConfigResponse:
  type: object
  required:
    - success
    - config
  properties:
    success:
      type: boolean
      enum:
        - true
    config:
      $ref: '#/AppConfig'
AppConfigUpdateRequest:
  type: object
  description: Частичное обновление конфигурации (все поля опциональны)
  properties:
    KOSMOS_BASE_URL:
      type: string
      format: uri
      example: http://usa:3002/v1
    KOSMOS_MODEL:
      type: string
      example: RICH
    KOSMOS_LOGIC_ARHITECT_MODEL:
      type: string
      nullable: true
      example: INSTRUCT
    LOG_LEVEL:
      type: string
      enum:
        - debug
        - info
        - warn
        - error
    NATURAL_QUERY_SUGGEST_LIMIT:
      type: integer
      minimum: 1
      maximum: 100
    NATURAL_QUERY_SIMILARITY_THRESHOLD:
      type: number
      minimum: 0
      maximum: 1
    NATURAL_QUERY_AUTO_USE_THRESHOLD:
      type: number
      minimum: 0
      maximum: 1
AppConfigUpdateResponse:
  type: object
  required:
    - success
    - config
    - message
  properties:
    success:
      type: boolean
      enum:
        - true
    config:
      $ref: '#/AppConfig'
    message:
      type: string
      example: Configuration updated successfully
AppConfigValidationError:
  type: object
  required:
    - success
    - error
    - validationErrors
  properties:
    success:
      type: boolean
      enum:
        - false
    error:
      type: string
      example: Configuration validation failed
    validationErrors:
      type: array
      items:
        type: string
      example:
        - "KOSMOS_BASE_URL must be a valid URL"
        - "LOG_LEVEL must be one of: debug, info, warn, error"
PromptsConfig:
  type: object
  required:
    - l1l2Templates
    - rag
    - naturalQuery
    - vectorOperations
  properties:
    l1l2Templates:
      type: object
      description: Промпты для генерации L1/L2 чанков по типу файла и объекта
      additionalProperties: true
    rag:
      type: object
      required:
        - systemPrompt
        - userPromptTemplate
      properties:
        systemPrompt:
          type: string
          description: Системный промпт для RAG-чата
        userPromptTemplate:
          type: string
          description: Шаблон промпта пользователя с плейсхолдерами {context} и {question}
    naturalQuery:
      type: object
      required:
        - scriptGeneration
        - humanize
      properties:
        scriptGeneration:
          type: string
          description: Промпт для генерации JS-скриптов Natural Query Engine
        humanize:
          type: string
          description: Промпт для преобразования сырых данных в человекочитаемый текст
    vectorOperations:
      type: object
      required:
        - qaPromptTemplate
      properties:
        qaPromptTemplate:
          type: string
          description: Шаблон промпта для QA операций
PromptsConfigResponse:
  type: object
  required:
    - success
    - config
  properties:
    success:
      type: boolean
      enum:
        - true
    config:
      $ref: '#/PromptsConfig'
PromptsConfigUpdateRequest:
  type: object
  required:
    - updates
  properties:
    updates:
      $ref: '#/PromptsConfig'
      description: Полная или частичная конфигурация промптов для обновления
    comment:
      type: string
      nullable: true
      description: Опциональный комментарий к изменению
      example: "Улучшил промпт для SQL функций"
PromptsConfigUpdateResponse:
  type: object
  required:
    - success
    - config
    - historyEntry
    - message
  properties:
    success:
      type: boolean
      enum:
        - true
    config:
      $ref: '#/PromptsConfig'
    historyEntry:
      $ref: '#/PromptsConfigHistoryEntry'
    message:
      type: string
      example: Prompts configuration updated successfully
PromptsConfigHistoryEntry:
  type: object
  required:
    - id
    - version
    - createdAt
  properties:
    id:
      type: integer
      description: ID записи истории
    version:
      type: integer
      description: Номер версии конфигурации
    createdAt:
      type: string
      format: date-time
      description: Дата и время создания версии
    comment:
      type: string
      nullable: true
      description: Комментарий к изменению
PromptsConfigHistoryResponse:
  type: object
  required:
    - success
    - history
    - count
  properties:
    success:
      type: boolean
      enum:
        - true
    history:
      type: array
      items:
        $ref: '#/PromptsConfigHistoryEntry'
    count:
      type: integer
      description: Количество записей в ответе
PromptsConfigHistoryEntryFull:
  type: object
  required:
    - id
    - version
    - createdAt
    - config
  properties:
    id:
      type: integer
      description: ID записи истории
    version:
      type: integer
      description: Номер версии конфигурации
    createdAt:
      type: string
      format: date-time
      description: Дата и время создания версии
    comment:
      type: string
      nullable: true
      description: Комментарий к изменению
    config:
      $ref: '#/PromptsConfig'
      description: Полный snapshot конфигурации
PromptsConfigHistoryEntryResponse:
  type: object
  required:
    - success
    - historyEntry
  properties:
    success:
      type: boolean
      enum:
        - true
    historyEntry:
      $ref: '#/PromptsConfigHistoryEntryFull'
PromptsConfigRestoreRequest:
  type: object
  properties:
    comment:
      type: string
      nullable: true
      description: Опциональный комментарий к восстановлению
      example: "Restored from version 5"
PromptsConfigValidationError:
  type: object
  required:
    - success
    - error
    - validationErrors
  properties:
    success:
      type: boolean
      enum:
        - false
    error:
      type: string
      example: Configuration validation failed
    validationErrors:
      type: array
      items:
        type: string
      example:
        - "rag.systemPrompt must be a non-empty string"
        - "naturalQuery.scriptGeneration must be a non-empty string"
