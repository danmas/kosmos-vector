# Paths: /api/file-content (безопасное чтение файлов), /api/files (deprecated) — работа с файлами проекта.
---
/api/file-content:
  get:
    tags:
      - Project
    summary: Получить содержимое файла для просмотра
    description: |
      Безопасное получение содержимого файла для просмотра на фронтенде.

      Особенности:
      - Защита от path traversal атак
      - Максимальный размер файла: 5 МБ
      - Кодировка: UTF-8 с обработкой ошибок для бинарных файлов
      - Поддержка относительных и абсолютных путей
    operationId: getFileContent
    parameters:
      - name: context-code
        in: query
        required: true
        description: Контекстный код для изоляции данных
        schema:
          type: string
          example: FULL_TEST
      - name: path
        in: query
        required: true
        description: Относительный путь к файлу (например, ./components/FileExplorer.tsx)
        schema:
          type: string
          example: ./components/Dashboard.tsx
    responses:
      '200':
        description: Содержимое файла успешно получено
        content:
          text/plain:
            schema:
              type: string
              example: |
                import React from 'react';
                export function FileExplorer() {
                  // ... component code
                }
      '400':
        description: Неверные параметры, файл слишком большой или бинарный
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            examples:
              missingPath:
                value:
                  success: false
                  error: 'Missing or invalid query parameter: path'
              fileTooLarge:
                value:
                  success: false
                  error: 'File is too large: 7.25 MB (max: 5 MB)'
              binaryFile:
                value:
                  success: false
                  error: File is not a valid UTF-8 text file (possibly binary)
              notAFile:
                value:
                  success: false
                  error: Path is not a file
      '403':
        description: Доступ запрещен (path traversal заблокирован)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              success: false
              error: 'Access denied: file is outside of project root path'
      '404':
        description: Файл не найден
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
            example:
              success: false
              error: 'File not found: ./nonexistent.txt'
      '500':
        description: Ошибка сервера при чтении файла
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
/api/files:
  get:
    deprecated: true
    tags:
      - Knowledge Base
    summary: Устаревшее получение дерева
    description: Используйте /api/project/tree
    parameters:
      - name: context-code
        in: query
        required: true
        description: Контекстный код для изоляции данных (произвольная строка)
        schema:
          type: string
          example: CARL
    responses:
      '410':
        description: Gone — используйте новые эндпоинты
