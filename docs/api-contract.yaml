# AiItem RAG Architect API — главный контракт (OpenAPI 3.0.3)
# Содержит: info, servers, tags и $ref на модули в openapi/schemas, openapi/paths, openapi/responses.
# Для единого файла используйте бандлер: npx @redocly/cli bundle docs/api-contract.yaml -o docs/api-contract-bundled.yaml
---
openapi: 3.0.3
info:
  title: AiItem RAG Architect API
  info:
    version: 2.9.0
    description: |
      RESTful API для системы RAG-анализа кодовой базы.

      Версия 2.9.0:
      • Добавлен Prompts Config API с историей изменений
      • GET /api/prompts-config - получить текущую конфигурацию промптов
      • PATCH /api/prompts-config - обновить с сохранением в историю
      • GET /api/prompts-config/history - список версий
      • GET /api/prompts-config/history/{id} - получить конкретную версию
      • POST /api/prompts-config/restore/{id} - восстановить из истории
      • POST /api/prompts-config/reset - сбросить к дефолтным значениям
      • DELETE /api/prompts-config/history/{id} - удалить запись истории
      • История хранится в PostgreSQL (таблица prompt_config_history)
      • Автоудаление старых версий (оставляется последние 100)
      • Валидация структуры prompts.json

      Версия 2.8.0:
      • Добавлен App Config API: управление глобальной конфигурацией приложения (config.json)
      • GET /api/config - получить текущую конфигурацию
      • PATCH /api/config - частично обновить конфигурацию
      • POST /api/config/reset - сбросить к дефолтным значениям
      • Валидация: KOSMOS_BASE_URL (формат URL), LOG_LEVEL (enum)
      • Не требует context-code (глобальные настройки)

      Версия 2.7.1:
      • Добавлен GET /api/file-content - безопасное получение содержимого файлов для просмотра
      • Защита от path traversal атак
      • Ограничение размера файла 5 МБ
      • Поддержка UTF-8 с обработкой ошибок для бинарных файлов

      Версия 2.7.0:
      • Добавлен Advanced RAG API: интеллектуальный поиск контекста с множественными стратегиями
      • POST /api/rag/retrieve - получение структурированного контекста без LLM
      • POST /api/rag/ask - RAG-ответы с настраиваемыми стратегиями поиска
      • POST /api/rag/compare-strategies - сравнение эффективности стратегий
      • GET /api/rag/strategies - список доступных RAG-стратегий
      • Поддержка 4 стратегий: Simple, Hierarchical, AI Item, Hybrid
      • Многоуровневая иерархия чанков (L0/L1/L2) с автоматической сборкой контекста
      • 4 стиля форматирования: Compact, Standard, Full, Markdown
      • Интеграция со связями (link table) для расширенного контекста
      • Обновлён /api/chat для использования улучшенного RAG-движка

      Версия 2.6.0:
      • Добавлен Column Extraction API: POST /api/items/{id}/extract-columns для извлечения колонок таблиц из SQL-функций
      • Добавлен Batch Column Extraction: POST /api/extract-all-columns для пакетного извлечения колонок из всех SQL-функций
      • Новый тип ai_item: table_column для представления колонок таблиц
      • Новые типы связей: reads_column, updates_column, inserts_column
      • Резолвинг полных имён колонок через загруженные таблицы

      Версия 2.5.1:
      • Добавлены API для массовых операций с тегами: POST /api/ai-items/bulk/tags/add и POST /api/ai-items/bulk/tags/remove
      • Поддержка bulk операций для эффективного управления тегами множества AiItems

      Версия 2.4.1:
      • Добавлен Chunks API: POST /api/files/vectorize-chunk/{chunkId} для векторизации конкретного чанка

      Версия 2.4.0:
      • Добавлен Prompts API: полный CRUD для управления промптами LLM
      • Гранулярный доступ к промптам: /api/prompts/l1l2/{fileType}/{objectType}/{level}
      • Импорт/экспорт промптов в JSON/YAML
      • Валидация структуры промптов без сохранения
      • Промпты хранятся глобально в prompts.json (файловая система)

      Версия 2.3.0:
      • Добавлен Natural Query Engine: запросы на естественном языке с автогенерацией скриптов
      • Эндпоинт /api/v1/natural-query для интеллектуального анализа кодовой базы
      • CRUD для управления кэшем скриптов: /api/agent-scripts
      • FTS-поиск похожих вопросов для переиспользования скриптов

      Версия 2.2.0:
      • Добавлена поддержка Logic Graph: сохранение и получение графов логики функций через /api/items/{id}/logic-graph
      • Интеграция с Logic Architect для визуализации потока управления функций

      Версия 2.1.2:
      • Расширена поддержка языков: language теперь свободное поле (sql, csharp, rust и любые другие)
      • Убрано жёсткое ограничение enum для гибкости
      • Полная совместимость с предыдущими версиями
  contact:
    name: AiItem RAG Architect Team
  license:
    name: MIT
servers:
  - url: http://localhost:3200
    description: Development server
  - url: https://api.aiitem.example.com
    description: Production server
tags:
  - name: Core
    description: AiItems, статистика, граф зависимостей
  - name: Project
    description: Новая модель — дерево файлов + точный выбор
  - name: Knowledge Base
    description: Классическая настройка проекта (полностью поддерживается и расширена)
  - name: RAG Chat
    description: Чат с RAG-движком
  - name: Advanced RAG
    description: |
      Интеллектуальный поиск контекста с множественными стратегиями.
      Поддерживает 4 стратегии поиска, многоуровневую иерархию чанков и гибкое форматирование контекста.
  - name: Natural Query
    description: Natural Query Engine — запросы на естественном языке с автогенерацией скриптов
  - name: Pipeline
    description: Управление pipeline обработки
  - name: Streaming
    description: Server-Sent Events (логи, прогресс)
  - name: System
    description: Health, логи, контракт, глобальная конфигурация приложения
  - name: Prompts
    description: |
      Управление промптами для LLM.
      Промпты хранятся глобально в файле prompts.json и применяются ко всем контекстам.
      Изменения сохраняются в файловую систему и персистентны между перезапусками.
  - name: Tags
    description: |
      Управление тегами для классификации и группировки AiItems.
      Теги изолированы по context-code.
  - name: Chunks
    description: |
      Управление чанками (chunk_vector): векторизация, обновление метаданных.
